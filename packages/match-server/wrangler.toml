name = "telegraph-duel-match-server"
main = "src/index.ts"
compatibility_date = "2024-11-27"

[durable_objects]
bindings = [
  { name = "MATCH_ROOM", class_name = "MatchRoom" },
  { name = "SCORE_BOARD", class_name = "ScoreBoard" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ScoreBoard"]
